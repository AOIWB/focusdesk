[package]
name = "focusdesk"
version = "0.2.1"
description = "A local-first quadrant workspace for your tasks and projects"
authors = ["FocusDesk contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "focusdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Preserve host build symbols: Apple ld 27037 otherwise emits a malformed
# LINKEDIT section for the sqlx procedural macro on some macOS toolchains.
[profile.release.build-override]
debug = 1
strip = "none"
